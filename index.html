<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a914c" />
    <meta
      name="description"
      content="LAKERS STORE : achetez et vendez des téléphones mobiles au Bénin en toute confiance. Prix en FCFA."
    />
    <title>LAKERS STORE - Téléphones au Bénin</title>
    <script>
      // Restaure l'URL d'origine transmise par public/404.html (GitHub Pages)
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&')
            })
            .join('?')
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash)
        }
      })(window.location)
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
